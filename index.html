<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>বাংলা পোকা সদস্য ফর্ম</title>
  <link href="https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'SolaimanLipi', sans-serif; background: linear-gradient(135deg, #f6f8f9, #e0f7fa); padding: 20px; }
    h1 { text-align: center; color: #00796b; margin-bottom: 30px; }
    form { max-width: 700px; margin: auto; background: #fff; padding: 25px 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transition: transform 0.3s; }
    form:hover { transform: translateY(-3px); }
    label { display: block; margin-top: 15px; font-weight: bold; color: #004d40; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #b2dfdb; font-size: 16px; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #00796b; box-shadow: 0 0 5px rgba(0,121,107,0.3); }
    button { margin-top: 20px; padding: 14px 25px; font-size: 18px; background: #00796b; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #004d40; }
    .error { color: red; margin-top: 5px; font-weight: bold; }
    .success { color: green; margin-top: 10px; font-weight: bold; }
    @media (max-width: 768px) { form { padding: 20px; } }
  </style>
</head>
<body>

<h1>বাংলা পোকা সদস্য ফর্ম</h1>

<form id="memberForm">
  <label>নাম</label>
  <input type="text" name="name" placeholder="আপনার নাম লিখুন" required>
  <label>পিতার নাম</label>
  <input type="text" name="father" placeholder="পিতার নাম লিখুন" required>
  <label>মাতার নাম</label>
  <input type="text" name="mother" placeholder="মাতার নাম লিখুন" required>
  <label>জন্ম তারিখ</label>
  <input type="date" name="dob" required>
  <label>লিঙ্গ</label>
  <select name="gender" required>
    <option value="">-- নির্বাচন করুন --</option>
    <option value="পুরুষ">পুরুষ</option>
    <option value="নারী">নারী</option>
    <option value="অন্যান্য">অন্যান্য</option>
  </select>
  <label>রক্তের গ্রুপ</label>
  <input type="text" name="blood" placeholder="উদাঃ A+, B+" required>
  <label>জাতীয় পরিচয়পত্র / জন্মনিবন্ধন</label>
  <input type="text" name="nid" required>
  <label>বর্তমান ঠিকানা</label>
  <textarea name="presentAddress" rows="2" required></textarea>
  <label>স্থায়ী ঠিকানা</label>
  <textarea name="permanentAddress" rows="2" required></textarea>
  <label>মোবাইল নম্বর</label>
  <input type="text" name="phone" placeholder="017xxxxxxxx" required>
  <label>ইমেইল (যদি থাকে)</label>
  <input type="email" name="email" placeholder="example@gmail.com">
  <label>শিক্ষাপ্রতিষ্ঠানের নাম</label>
  <input type="text" name="institution" required>
  <label>শ্রেণি / বিভাগ</label>
  <input type="text" name="classDept" required>
  <label>সদস্যপদ লক্ষ্য</label>
  <textarea name="purpose" rows="2" required></textarea>
  <label>আপনার আগ্রহের ক্ষেত্র</label>
  <input type="text" name="interest" placeholder="উদাঃ বিতর্ক, নাটক, সংগীত" required>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <button type="submit">জমা দিন</button>
</form>

<button type="button" style="margin-top:15px; background:#00796b; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;" onclick="window.location.href='admin-login.html'">
  অ্যাডমিন প্যানেল
</button>

<script>
  const FORM_URL = "https://script.google.com/macros/s/AKfycbw1Ch8MBnV7Dk3p9_JOtKmG1IfFjxlZ6a0ATqNqOPshMMwmN7eaST2YDbU5ptGvwcs5/exec";

  const form = document.getElementById("memberForm");
  const errorDiv = document.getElementById("error");
  const successDiv = document.getElementById("success");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorDiv.textContent = "";
    successDiv.textContent = "";

    const data = {};
    new FormData(form).forEach((value, key) => { data[key] = value; });

    try {
      const res = await fetch(FORM_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (result.success) {
        successDiv.textContent = "আপনার আবেদন সফলভাবে জমা হয়েছে। ধন্যবাদ!";
        form.reset();
      } else {
        errorDiv.textContent = "ত্রুটি হয়েছে: " + result.message;
      }
    } catch (err) {
      errorDiv.textContent = "সার্ভারে সমস্যা হয়েছে। পরে চেষ্টা করুন।";
    }
  });
</script>

</body>
</html>
