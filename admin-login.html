<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>বাংলা পুকা অ্যাডমিন লগইন</title>
  <link href="https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'SolaimanLipi', sans-serif; background: linear-gradient(135deg, #f0f4c3, #e1f5fe); display:flex; justify-content:center; align-items:center; height:100vh; }
    .login-box { background:#fff; padding:30px 40px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.1); max-width:400px; width:100%; text-align:center; }
    h1 { color:#33691e; margin-bottom:25px; }
    input { width:100%; padding:12px; margin:15px 0; border-radius:8px; border:1px solid #c5e1a5; font-size:16px; }
    button { padding:12px 25px; font-size:18px; background:#33691e; color:white; border:none; border-radius:10px; cursor:pointer; transition:0.3s; }
    button:hover { background:#1b5e20; }
    .error { color:red; margin-top:10px; font-weight:bold; }
  </style>
</head>
<body>

<div class="login-box">
  <h1>অ্যাডমিন লগইন</h1>
  <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
  <button id="loginBtn">লগইন</button>
  <div class="error" id="error"></div>
</div>

<script>
  const loginBtn = document.getElementById("loginBtn");
  const passwordInput = document.getElementById("password");
  const errorDiv = document.getElementById("error");
  const FORM_URL = "https://script.google.com/macros/s/AKfycbw1Ch8MBnV7Dk3p9_JOtKmG1IfFjxlZ6a0ATqNqOPshMMwmN7eaST2YDbU5ptGvwcs5/exec";

  loginBtn.addEventListener("click", async () => {
    const entered = passwordInput.value.trim();
    try {
      const res = await fetch(FORM_URL + "?action=verifyAdmin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: entered })
      });
      const result = await res.json();
      if (result.success) {
        window.location.href = "admin.html?password=" + encodeURIComponent(entered);
      } else {
        errorDiv.textContent = "পাসওয়ার্ড সঠিক নয়।";
      }
    } catch (err) {
      errorDiv.textContent = "সার্ভারের সমস্যা হয়েছে। পরে চেষ্টা করুন।";
    }
  });

  passwordInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });
</script>

</body>
</html>
